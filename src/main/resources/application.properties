spring.application.name=pi-control-centre
fast.metrics.collector.interval=2s
sensor.metrics.collector.interval=5s
slow.metrics.collector.interval=30s
db.metrics.collector.updater.interval=10s
spring.data.redis.host=localhost
spring.data.redis.port=6379
# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/pi-control-center
spring.datasource.username=picontrol
spring.datasource.password=postgres@113344

# Hibernate schema management (development)
spring.jpa.hibernate.ddl-auto=update

# Show SQL during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true